name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
env:
  MOONBIT_VERSION: 0.10.20+65efd5b93
jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [wasm-gc, native]
    steps:
      - uses: actions/checkout@v5
      - name: Install tested MoonBit toolchain
        run: |
          curl --retry 3 -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s "$MOONBIT_VERSION"
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - run: moon version --all
      - run: moon test --target ${{ matrix.target }} --deny-warn
      - run: moon run cmd/main --target ${{ matrix.target }}
  host:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
      - name: Install tested MoonBit toolchain
        run: |
          curl --retry 3 -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s "$MOONBIT_VERSION"
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - run: moon test --target js --deny-warn
      - run: |
          moon info
          moon fmt
          git diff --exit-code
      - run: node scripts/build.mjs
      - run: node --test tests/*.test.mjs
      - name: Deterministic synthetic examples
        run: |
          node scripts/make-examples.mjs
          git diff --exit-code -- examples
      - name: Scaling smoke check
        run: node scripts/benchmark.mjs
      - name: Browser interactions and cancellation
        if: matrix.node == 24
        run: |
          node scripts/serve.mjs > work/serve.log 2>&1 &
          npx --yes --package @playwright/cli@0.1.24 playwright-cli -s=ci open http://127.0.0.1:4173
          npx --yes --package @playwright/cli@0.1.24 playwright-cli -s=ci run-code --filename scripts/browser-smoke.js
          npx --yes --package @playwright/cli@0.1.24 playwright-cli -s=ci close

